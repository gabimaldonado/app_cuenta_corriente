<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#ffffff"/>

  <text x="40" y="34" font-size="20" font-weight="bold" fill="#222222">Flujo de estados de una entrega a prueba</text>

  <!-- ===== Fila 1: estado de cada prenda ===== -->
  <text x="40" y="70" font-size="12" font-weight="bold" fill="#666666">ESTADO DE CADA PRENDA (tabla entrega_items)</text>

  <rect x="40" y="85" width="220" height="95" rx="10" fill="#eef3fb" stroke="#2b5aa8" stroke-width="2"/>
  <text x="150" y="115" font-size="15" font-weight="bold" fill="#1c3f7a" text-anchor="middle">Se crea la entrega</text>
  <text x="150" y="138" font-size="13" fill="#333333" text-anchor="middle">POST entregas.php</text>
  <text x="150" y="160" font-size="12" fill="#555555" text-anchor="middle">Se lleva las prendas a probar</text>

  <rect x="340" y="85" width="200" height="95" rx="10" fill="#fff6e0" stroke="#c58a00" stroke-width="2"/>
  <text x="440" y="115" font-size="17" font-weight="bold" fill="#8a5f00" text-anchor="middle">en_prueba</text>
  <text x="440" y="138" font-size="13" fill="#333333" text-anchor="middle">El stock baja 1</text>
  <text x="440" y="160" font-size="13" fill="#333333" text-anchor="middle">NO suma al saldo</text>

  <rect x="650" y="55" width="200" height="80" rx="10" fill="#e6f5ea" stroke="#2e8b4a" stroke-width="2"/>
  <text x="750" y="86" font-size="17" font-weight="bold" fill="#1d6a37" text-anchor="middle">comprada</text>
  <text x="750" y="110" font-size="13" fill="#333333" text-anchor="middle">SÍ suma al saldo</text>

  <rect x="650" y="150" width="200" height="80" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="750" y="181" font-size="17" font-weight="bold" fill="#9c2a1f" text-anchor="middle">devuelta</text>
  <text x="750" y="205" font-size="13" fill="#333333" text-anchor="middle">Vuelve al stock (+1)</text>

  <!-- flechas fila 1 -->
  <line x1="260" y1="132" x2="338" y2="132" stroke="#444444" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="540" y1="115" x2="648" y2="95" stroke="#444444" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="540" y1="150" x2="648" y2="190" stroke="#444444" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="552" y="92" font-size="12" fill="#333333">se la queda</text>
  <text x="552" y="196" font-size="12" fill="#333333">la devuelve</text>
  <text x="500" y="252" font-size="11" fill="#666666">Ambas salidas: PUT confirmar_entrega.php</text>

  <!-- ===== Fila 2: estado de la entrega ===== -->
  <text x="40" y="285" font-size="12" font-weight="bold" fill="#666666">ESTADO DE LA ENTREGA (tabla entregas)</text>

  <rect x="40" y="300" width="200" height="75" rx="10" fill="#fff6e0" stroke="#c58a00" stroke-width="2"/>
  <text x="140" y="330" font-size="17" font-weight="bold" fill="#8a5f00" text-anchor="middle">abierta</text>
  <text x="140" y="354" font-size="12" fill="#555555" text-anchor="middle">Tiene prendas a prueba</text>

  <rect x="400" y="300" width="200" height="75" rx="10" fill="#e8e8e8" stroke="#555555" stroke-width="2"/>
  <text x="500" y="330" font-size="17" font-weight="bold" fill="#333333" text-anchor="middle">cerrada</text>
  <text x="500" y="354" font-size="12" fill="#555555" text-anchor="middle">Ya se decidió todo</text>

  <line x1="240" y1="337" x2="398" y2="337" stroke="#444444" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="319" y="328" font-size="12" fill="#333333" text-anchor="middle">al confirmar</text>
  <text x="319" y="357" font-size="11" fill="#666666" text-anchor="middle">(transacción)</text>

  <!-- Conexión: al crear queda abierta -->
  <line x1="225" y1="180" x2="225" y2="298" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <text x="235" y="245" font-size="11" fill="#666666">queda abierta</text>

  <!-- Nota -->
  <text x="640" y="322" font-size="12" fill="#333333">Una entrega cerrada no se</text>
  <text x="640" y="340" font-size="12" fill="#333333">puede confirmar de nuevo:</text>
  <text x="640" y="358" font-size="12" fill="#333333">la API responde 409.</text>

  <text x="40" y="415" font-size="12" fill="#666666">El saldo no se guarda: se calcula sumando las prendas en estado «comprada» y restando los pagos.</text>
</svg>
